project:
  type: book
  output-dir: docs
  
book:
  title: "Türkiye Kuşlarının Doğa Tarihi"
  subtitle: "Türlerin Coğrafi Yayılışı, Üreme Biyolojisi ve Taksonomik Durumu"

  author:
    name: "Kerem Ali Boyla, Editör"
    orcid: "0000-0002-1825-0097"

  date: "2026-01-18"
  date-format: "DD/MM/YYYY"

  cover-image: kapak3.png
  favicon: kapak3.png

  repo-url: https://github.com/keremaliboyla/turkiye-kuslari
  repo-actions: [edit, issue]

  chapters:
    - index.qmd
    - 01_ordekgiller.qmd
    - 02_tavukgiller_vd.qmd
    - 03_bataklik-kuslari.qmd
    - 04_cilibitlar.qmd
    - 05_cullukgiller.qmd
    - 06_martilar.qmd
    - 07_deniz-ve-gol-kuslari.qmd
    - 08_yirticilar.qmd
    - 09_baykuslar.qmd
    - 10_otucu-oncesi.qmd
    - 11_kargamsilar.qmd
    - 12_toygarlar.qmd
    - 13_kamiscinlar.qmd
    - 14_otlegenler.qmd
    - 15_tirmasiklar.qmd
    - 16_sinekkapanlar.qmd
    - 17_serceler.qmd
    - 18_ispinozlar.qmd

    - part: "Ek Bilgiler"
      chapters: 
        - 00_giris.qmd
        - 00_tesekkurler.qmd
        - 00_kitabin_icerigi.qmd
        - 00_ornitoloji_tarihi.qmd
        - 00_bilgi_kaynaklari.qmd

    - references.qmd

bibliography: references.bib
csl: nature.csl
# csl: journal-of-zoology.csl


lang: tr
language: _language-tr.yml

format:
  html:
    grid:
      body-width: 670px
    theme: cosmo
    number-depth: 1

  typst:
    toc: true
    number-sections: true
    section-numbering: "1.1"
    papersize: a4
    fontsize: 11pt
    margin:
      top: 2.5cm
      bottom: 2.5cm
      left: 3cm
      right: 3cm

editor: visual